version: 2.1
setup: true
orbs:
  qqq-orb: kingsrook/qqq-orb@dev:snapshot
workflows:
  setup:
    jobs:
    - qqq-orb/generate_pipeline:
        orb_version: dev:snapshot
        filters:
          branches:
            ignore: automation/qbit-rc-pending
          tags:
            only: /.*/
        run_playwright: << pipeline.parameters.run_playwright >>
parameters:
  run_playwright:
    type: boolean
    default: false
